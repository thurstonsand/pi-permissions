min_version = "2026.10.4"

[settings]
experimental = true

[hooks]
enter = "mise bootstrap --yes --quiet"

[tools]
hk = "2.11.1"
# hk's check and fix hooks run jactionlint, which runs shellcheck over every `run:` script. Renovate
# does not know mise's `jactionlint` shorthand, so the backend is spelled out.
"aqua:jdx/jactionlint" = "2.5.0"
shellcheck = "0.11.0"
node = "26"

[env]
HK_MISE = "1"
_.path = ["{{config_root}}/node_modules/.bin"]

[tasks.bootstrap]
description = "Install project dependencies and git hooks"
run = [
    "npm install --silent --no-fund --no-audit",
    # pi must always resolve to the global install, never this repo's copy
    "rm -f node_modules/.bin/pi",
    "hk install --mise --quiet",
]
sources = ["mise.toml", "hk.pkl", "package.json", "package-lock.json"]
outputs = { auto = true }
quiet = true

[tasks.lint]
description = "Lint"
depends = ["lint:*"]

[tasks."lint:biome"]
description = "Lint TypeScript, JSON, and Markdown"
run = "biome check ."

[tasks."lint:changelog"]
description = "Check CHANGELOG.md headings and that the top release is package.json's version"
run = "node scripts/check-changelog.mjs"

# `npm ci` installs whatever the lockfile says without re-resolving it, so a lockfile that `npm install`
# can no longer resolve (ERESOLVE) still passes CI. Re-resolving here downloads only the metadata of
# specs that changed. It must run on mise's npm: another npm version rewrites the lockfile.
[tasks."lint:lockfile"]
description = "Check that package-lock.json still resolves from package.json, unchanged"
run = [
    "npm install --package-lock-only --ignore-scripts --no-audit --no-fund",
    "git diff --exit-code package-lock.json",
]

[tasks."lint:actions"]
description = "Lint GitHub Actions workflows"
run = "hk check --all --step jactionlint"

[tasks.format]
description = "Format and apply safe fixes"
run = ["biome check --write .", "hk fix --all --step jactionlint"]

[tasks.typecheck]
description = "Type-check TypeScript"
run = "tsc --noEmit"

[tasks.test]
description = "Run tests"
run = "vitest run"

[tasks.check]
description = "Run full verification"
depends = ["lint", "typecheck", "test"]

[tasks.release]
description = "Release a version: date its changelog section, commit, tag, and push"
usage = 'arg "<version>" help="The version to release, as x.y.z"'
run = 'scripts/release.sh "${usage_version}"'

# Renovate's tasks run under MISE_ENV=renovate, whose mise.renovate.toml overlays Renovate and the
# Node it supports, so its install stays out of every bootstrap and mise both installs and runs it
# on that Node: re2, Renovate's native regex engine, is built for the Node that installs it and
# refuses to load in another, leaving validation on JavaScript RegExp with only a warning. `mise x`
# also puts that Node ahead of a Homebrew one already on PATH.
[tasks.renovate]
description = "Run Renovate"
run = "MISE_ENV=renovate mise x -- renovate"

[tasks."lint:renovate"]
description = "Validate Renovate configuration"
run = "MISE_ENV=renovate mise x -- renovate-config-validator renovate.json"
